# ═══════════════════════════════════════════════════════════════════════════
# SITE MATERIALS
# One entry per slide deck, recording, document, notebook or code sample.
# (Full write-ups belong in collections/_tutorials/ instead — see that folder's
# README for how those get added; they show up automatically alongside these.)
#
# Copy the TEMPLATE block below, fill it in, and add it to `items:`.
# Only `id`, `title` and `type` are required — everything else is optional
# but improves search/filtering, so fill in what you can.
#
# ── TEMPLATE ──────────────────────────────────────────────────────────────
# - id: "unique-kebab-case-id"        # required, must be unique across all items
#   title: "Title shown on the card"  # required
#   type: "slides"                    # required — one of: slides | video | document | notebook | code
#   event_id: "event-id-from-events.yml"   # optional — omit if not tied to an event
#   authors:                          # optional — ids from _data/people.yml
#     - "person-id"
#   tags:                             # optional — free-text topic tags, lowercase-kebab-case
#     - topic-tag
#   audience_level: "practitioner"    # optional — one of: intro | practitioner | advanced
#   thumbnail: ""                     # optional — path to a preview image, e.g. /assets/materials/thumbs/x.png
#   src: "/assets/materials/slides/example.pdf"   # required for slides/video — path or URL to the file
#   description: "One-sentence summary shown on the card itself."
#   caption: >
#     Longer description shown when the item is opened — what it covers,
#     why it's useful, any context a reader needs.
#   date: ""                          # optional — YYYY-MM-DD, defaults to event date if omitted
# ─────────────────────────────────────────────────────────────────────────

