pipeline:
  title: "Record Linkage Pipeline"
  description: "End-to-end conceptual pipeline for record linkage."

sections:
  - id: scoping
    title: "Scoping"
    summary: "Define objectives, datasets, and constraints before any data work begins."
    methods:
      - name: "Problem Definition"
        tags: ["concept"]
        concepts: [entity_resolution, entity, record, data_linkage]
        terms:
          - term: "Entity Resolution"
            definition: "Identifying records referring to the same entity."
            tags: ["core"]
          - term: "Use Case"
            definition: "Specific linkage scenario."
            tags: ["concept"]

  - id: data-prep
    title: "Data Preparation"
    summary: "Clean, standardise, and structure input data to maximise match quality."
    methods:
      - name: "Cleaning & Standardisation"
        tags: ["prep"]
        concepts: [data_cleaning, lexicon_mapping, address_matching]
        terms:
          - term: "Normalization"
            definition: "Standardising formats."
            tags: ["prep"]
          - term: "Parsing"
            definition: "Splitting fields into structured components."
            tags: ["prep"]

  - id: indexing
    title: "Indexing / Blocking"
    summary: "Reduce the comparison space by partitioning records into candidate pairs."
    methods:
      - name: "Blocking"
        tags: ["performance"]
        concepts: [blocking, blocking_rules, blocking_key, candidate_pairs]
        terms:
          - term: "Blocking Key"
            definition: "Field used to partition data."
            tags: ["core"]
          - term: "Sorted Neighbourhood"
            definition: "Sliding window over sorted data."
            tags: ["method"]
      - name: "Indexing"
        tags: ["performance"]
        concepts: [candidate_pairs, blocking]
        terms:
          - term: "Canopy Clustering"
            definition: "Approximate grouping using cheap distance."
            tags: ["method"]

  - id: comparison
    title: "Comparison"
    summary: "Compute field-level similarities for each candidate pair."
    methods:
      - name: "String Comparison"
        tags: ["algorithm"]
        concepts: [comparisons, string_similarity, edit_distance, jaro_winkler, agreement_pattern]
        terms:
          - term: "Edit Distance"
            definition: "Operations needed to transform strings."
            tags: ["core"]
          - term: "Jaro-Winkler"
            definition: "String similarity measure."
            tags: ["method"]

  - id: classification
    title: "Classification"
    summary: "Decide match, non-match, or possible-match status for each pair."
    methods:
      - name: "Rule-based"
        tags: ["model"]
        concepts: [deterministic_linkage, match_key]
        terms:
          - term: "Threshold"
            definition: "Cutoff for classification."
            tags: ["core"]
      - name: "Probabilistic"
        tags: ["model"]
        concepts: [probabilistic_linkage, fellegi_sunter, weight, agreement_pattern]
        terms:
          - term: "Fellegi-Sunter Model"
            definition: "Probabilistic linkage framework."
            tags: ["core"]

  - id: evaluation
    title: "Evaluation"
    summary: "Assess linkage quality against ground truth or clerical review."
    methods:
      - name: "Metrics"
        tags: ["evaluation"]
        concepts: [linkage_metrics, precision, recall, f_measure]
        terms:
          - term: "Precision"
            definition: "Proportion of correct matches."
            tags: ["metric"]
          - term: "Recall"
            definition: "Proportion of true matches found."
            tags: ["metric"]

  - id: clerical
    title: "Clerical Review"
    summary: "Human validation of uncertain or borderline record pairs."
    methods:
      - name: "Manual Review"
        tags: ["human"]
        concepts: [clerical_review, cluster, gold_standard]
        terms:
          - term: "Gold Standard"
            definition: "Trusted labelled dataset."
            tags: ["evaluation"]


skos:
  concepts:

    # datatype
    - id: entity
      prefLabel: Entity
      definition: A thing, place, event, object, or person about which data has been collected.
      tags: [datatype]
      narrower: [record, cluster]

    - id: graph
      prefLabel: Graph
      definition: A data structure or visual model representing relationships between entities ({{nodes}}) connected by {{edge}}s.
      tags: [datatype, visualisation]
      narrower: [node, edge]
      related: [chart, cluster, entity]

    - id: table
      prefLabel: Table
      definition: A structured dataset composed of rows (records) and columns (fields).
      tags: [datatype]
      related: [record]

    - id: record
      prefLabel: Record
      definition: A single observation or {{entity}} instance within a dataset, typically represented as a row in a {{table}}.
      tags: [datatype]
      related: [table, candidate_pairs]

    - id: node
      prefLabel: Node
      definition: An individual point in a {{graph}} representing an {{entity}} or {{record}}.
      tags: [datatype]
      related: [edge, entity, record]

    - id: edge
      prefLabel: Edge
      definition: A connection between two {{node}}s in a {{graph}}, representing a relationship such as a {{link}}.
      tags: [datatype]
      related: [node, link]

    - id: cluster
      prefLabel: Cluster
      definition: A group of {{record}}s inferred to represent the same real-world {{entity}}.
      tags: [datatype]
      narrower: [cluster_id]
      related: [entity_resolution, deduplicate, clerical_review, link]

    - id: cluster_id
      prefLabel: Cluster ID
      definition: A unique identifier assigned to a {{cluster}} of {{record}}s representing the same {{entity}}.
      tags: [datatype]
      related: [entity_resolution, link]

    # method

    - id: entity_resolution
      prefLabel: Entity Resolution
      altLabel: [Record Linkage, Entity Matching, Data Linkage]
      definition: The process of determining whether multiple {{record}}s in one or more datasets refer to the same real-world {{entity}}.
      tags: [method]
      narrower: [probabilistic_linkage, deterministic_linkage, deduplicate, data_linkage, entity]
      related: [blocking, comparisons, cluster, splink]

    - id: deduplicate
      prefLabel: Deduplicate
      altLabel: [Deduplication]
      definition: Identification and removal of duplicate/redundant data in order to improve efficiency and reduce dataset size.
      tags: [method, processing]
      related: [cluster, data_cleaning]

    - id: clerical_review
      prefLabel: Clerical Review
      definition: Manual evaluation of {{cluster}}s that cannot be confidently defined as a match or non-match during linkage. This is usually done by a small team or person.
      tags: [method, evaluation, comparison]
      related: [linkage_metrics, cluster, gold_standard]

    - id: lexicon_mapping
      prefLabel: Lexicon Mapping
      definition: Process of matching/mapping different vocabularies, terminologies or coding systems to a common format using a pre-defined lexicon (e.g. mapping nicknames to their original source name).
      tags: [method, processing]
      related: [data_cleaning, address_matching]

    - id: address_matching
      prefLabel: Address Matching
      definition: Process of matching/mapping addresses or postcodes to a known reference point/database of address data.
      tags: [method, processing]
      related: [data_cleaning, lexicon_mapping, string_similarity]

    # tool
    # probabilistic

    - id: probabilistic_linkage
      prefLabel: Probabilistic Linkage
      altLabel: [Probabilistic Matching]
      definition: An evidence based approach to matching records. Takes data from across the entire dataset to determine matches based on using a threshold value instead of using concrete rules. Generally good for lower quality datasets where thresholds can be adjusted to account for errors or studies that don’t need to follow specific linkage requirements.
      tags: [method, probabilistic]
      narrower: [fellegi_sunter]
      related: [deterministic_linkage, comparisons, linkage_metrics, weight, splink]

    # deterministic

    - id: deterministic_linkage
      prefLabel: Deterministic Linkage
      altLabel: [Rules-based Linkage]
      definition: A strict rules-based approach where records must satisfy exact matching criteria to be considered a match. It works more directly than probabilistic linkage using set rules to determine what is classed as a match. This form of matching generally tends to be faster to run and good for higher quality datasets or those that have very specific linking requirements.
      tags: [method, deterministic]
      related: [probabilistic_linkage, match_key, blocking_rules]

    # comparison

    - id: blocking
      prefLabel: Blocking
      definition: A strategy for reducing the number of record pairs to compare by only comparing records that share a common blocking key value. More technically, it reduces the number of edges to be considered during matching. In Splink, this is normally done through a series of Blocking Rules, which are used to focus what the matching process considers during running.
      tags: [ method, comparison ]
      narrower: [ blocking_rules, blocking_key ]
      related: [ comparisons, candidate_pairs, splink ]

    - id: blocking_rules
      prefLabel: Blocking Rules
      definition: Rules used in the Blocking process to direct the linking algorithm as to what variables and as to what manner blocking should be performed on.
      tags: [ method ]
      related: [ blocking_key, match_key, deterministic_linkage ]

    - id: blocking_key
      prefLabel: Blocking Key
      definition: A derived value or field transformation used to partition records into groups for efficient pairwise comparison.
      tags: [ method, comparison ]
      related: [ blocking_rules, candidate_pairs, match_key ]

    - id: comparisons
      prefLabel: Comparisons
      definition: The process or resulting features derived from evaluating similarity or equality between fields of record pairs.
      tags: [ method, comparison, evaluation ]
      narrower: [ similarity_function, agreement_pattern ]
      related: [ agreement_pattern, blocking, candidate_pairs, splink ]

    - id: similarity_function
      prefLabel: Similarity Function
      definition: A mathematical function that quantifies the similarity between two values, often producing a score between 0 and 1.
      tags: [ method, comparison , probabilistic ]
      narrower: [ cosine_similarity, jaro_winkler_similarity, levenshtein_distance ]

    - id: cosine_similarity
      prefLabel: Cosine Similarity
      definition: A vector-based similarity measure that computes the cosine of the angle between two feature vectors. Commonly used on token or embedding representations of data during linkage.
      tags: [ method, comparison, probabilistic ]
      related: [ jaro_winkler_similarity, string_similarity ]

    - id: jaro_winkler_similarity
      prefLabel: Jaro-Winkler Similarity
      definition: A string similarity metric that measures how closely two text values match, giving higher weight to common prefixes. It is commonly used to compare names.
      tags: [ method, comparison, probabilistic ]
      related: [ cosine_similarity, string_similarity ]

    - id: levenshtein_distance
      prefLabel: Levenshtein Distance
      definition: A notable and commonly used implementation of edit distance.
      tags: [ method, comparison, probabilistic ]
      related: [ cosine_similarity, Jaro_Winkler_similarity, string_similarity ]


    # evaluation
    # visualisation
    # processing

    - id: data_cleaning
      prefLabel: Data Cleaning
      definition: The Process of cleaning unwanted or incorrect records or data errors from a dataset prior to linkage being performed. an example of this would be removing non-standard characters from a name column.
      tags: [method, processing]
      related: [entity_resolution, lexicon_mapping, address_matching, deduplicate]

    # Tool

    - id: splink
      prefLabel: Splink
      definition: A Python package for probabilistic {{entity resolution}} that allows you to {{deduplicate}} and link records from datasets without unique identifiers.
      tags: [tool, probabilistic]
      related: [probabilistic_linkage, comparisons, blocking, linkage_metrics]

    # model

    # privacy