- id: entity_resolution
  label: "Entity Resolution"
  definition: "Identifying and merging records that refer to the same real-world entity."
  related:
    - record_linkage
    - blocking
    - probabilistic_matching
  conflicts:
    - record_linkage_scope_confusion

- id: record_linkage
  label: "Record Linkage"
  definition: "Linking records across datasets that refer to the same entity."
  related:
    - entity_resolution
    - blocking
  conflicts:
    - record_linkage_scope_confusion

- id: blocking
  label: "Blocking"
  definition: "Reducing comparisons by grouping records into candidate sets."
  related:
    - record_linkage
    - entity_resolution

- id: probabilistic_matching
  label: "Probabilistic Matching"
  definition: "Matching based on likelihood rather than exact rules."
  related:
    - entity_resolution

- id: record_linkage_scope_confusion
  label: "Scope Confusion"
  definition: "Ambiguity between record linkage and entity resolution definitions."
  related:
    - record_linkage
    - entity_resolution