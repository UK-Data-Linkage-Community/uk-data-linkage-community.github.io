<div class="glossary-item" data-id="{{ include.term.id }}">

  <h2 class="term-title">{{ include.term.label }}</h2>

  <p class="definition">
    {{ include.term.definition }}
  </p>

  {% if include.term.aliases %}
  <div class="aliases">
    <strong>Also known as:</strong>
    {{ include.term.aliases | join: ", " }}
  </div>
  {% endif %}

  {% if include.term.use_cases %}
  <div class="use-cases">
    <strong>Use cases:</strong>
    <ul>
      {% for u in include.term.use_cases %}
        <li>{{ u }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

</div>
