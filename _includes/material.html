{% assign mat = page.materials | where: "id", include.id | first %}
{% if mat %}
{% if mat.type == "video" %}
{% include video.html src=mat.src caption=mat.caption %}
{% elsif mat.type == "pdf" %}
<div class="material material--pdf">
<a class="material__link" href="{{ mat.src | relative_url }}" target="_blank">{{ mat.title }}{% if mat.caption %} — {{ mat.caption }}{% endif %}</a>
</div>
{% endif %}
{% endif %}
