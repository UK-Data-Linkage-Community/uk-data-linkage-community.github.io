---
layout: default
---

<div class="glossary-container">
  <div id="glossary-graph"></div>
  <div id="term-detail">
    <p>Select a term to explore relationships</p>
  </div>
</div>

<script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>

<script>
const glossaryData = [
  {
    id: "entity_resolution",
    label: "Entity Resolution",
    definition: "Identifying and merging records that refer to the same real-world entity.",
    related: ["record_linkage", "blocking"]
  },
  {
    id: "record_linkage",
    label: "Record Linkage",
    definition: "Linking records across datasets.",
    related: ["entity_resolution"]
  },
  {
    id: "blocking",
    label: "Blocking",
    definition: "Reducing comparisons via grouping.",
    related: ["entity_resolution"]
  }
];

const elements = [];
const nodeIds = new Set();

glossaryData.forEach(term => {
  nodeIds.add(term.id);
  elements.push({
    data: {
      id: term.id,
      label: term.label,
      definition: term.definition
    }
  });
});

glossaryData.forEach(term => {
  (term.related || []).forEach(rel => {
    if (nodeIds.has(rel)) {
      elements.push({
        data: {
          source: term.id,
          target: rel
        }
      });
    }
  });
});

const cy = cytoscape({
  container: document.getElementById('glossary-graph'),
  elements: elements,
  layout: { name: 'cose' },
  style: [
    {
      selector: 'node',
      style: {
        label: 'data(label)',
        'background-color': 'var(--color-teal)',
        color: '#fff'
      }
    }
  ]
});

cy.on('tap', 'node', evt => {
  const node = evt.target.data();
  document.getElementById('term-detail').innerHTML = `
    <h2>${node.label}</h2>
    <p>${node.definition}</p>
  `;
});
</script>
